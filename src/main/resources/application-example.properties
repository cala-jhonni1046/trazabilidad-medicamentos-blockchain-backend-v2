# Copia de ejemplo de application.properties, con valores de ejemplo (no reales).
# application.properties NO se versiona (ver .gitignore); este archivo sí,
# para que cualquiera que clone el repo sepa qué variables de entorno
# necesita definir y con qué formato.

spring.application.name=trazabilidad-con-blockchain
server.port=8080

# PostgreSQL: en application.properties real, estos 3 valores se leen de
# las variables de entorno DB_URL, DB_USER y DB_PASSWORD (nunca hardcodeados).
# Acá se muestran los valores de ejemplo que tomarían esas variables:
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=changeme
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson: hora local de Argentina en las respuestas JSON (las fechas se guardan en UTC).
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Paginación (Page<T> de Spring Data)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT: en application.properties real se lee de JWT_SECRET. Generar con:
#   openssl rand -base64 48
jwt.secret=reemplazar-por-la-salida-de-openssl-rand-base64-48
jwt.expiracion-horas=8

# Usuario inicial SEDE_CENTRAL: en el real se lee de ADMIN_EMAIL y ADMIN_PASSWORD.
medichain.admin.email=admin@medichain.local
medichain.admin.password=cambiar-esta-clave

# Datos de demo (config/DatosDemo): se cargan SOLO con el perfil "demo".
# Activar con la variable de entorno SPRING_PROFILES_ACTIVE=demo y definir
# DEMO_PASSWORD (contraseña de todos los usuarios demo, mínimo 8 caracteres).
# En application.properties real se lee de DEMO_PASSWORD. Vacío = no carga la demo.
medichain.demo.password=

# Documentos de habilitación (PDF de cada empresa): carpeta FUERA del repo,
# nunca en la base ni en Git. Cada archivo se guarda como <sha256>.pdf.
# En application.properties real se lee de DOCUMENTOS_DIR; si falta, la app no arranca.
medichain.documentos.dir=/home/usuario/medichain-documentos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Inserción en tandas (lotes de hasta 10.000 cajas): los ids UUID los genera Hibernate, así que se pueden agrupar.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Anclaje en Ethereum Sepolia (paso 8, R15). APAGADO por defecto: la app y los tests no usan blockchain.
# En application.properties real se lee de variables de entorno (nunca escribir los valores acá):
#   ANCLAJE_HABILITADO      true para anclar (por defecto false)
#   SEPOLIA_RPC_URL         URL del nodo (Alchemy); SECRETA: lleva la API key
#   WALLET_PRIVATE_KEY      clave de la billetera dueña del contrato; SECRETA
#   ANCHOR_CONTRACT_ADDRESS dirección del contrato MediChainAnchor (contracts/GUIA-DESPLIEGUE.md)
# Si está habilitado y falta algo o tiene mal formato, la app no arranca (el mensaje no muestra valores).
# Una base nueva (reset) necesita un contrato nuevo.
medichain.anclaje.habilitado=false
medichain.anclaje.rpc-url=
medichain.anclaje.clave-privada=
medichain.anclaje.contrato=
medichain.anclaje.chain-id=11155111
medichain.anclaje.red=sepolia
# Confirmaciones (bloques encima) para CONFIRMADO; intentos antes de FALLIDO; tope de comisión por gas.
medichain.anclaje.confirmaciones=3
medichain.anclaje.max-intentos=5
medichain.anclaje.tope-gwei=20
# Una transacción sin incluir después de este tiempo se reemplaza (mismo nonce, +25 % de comisión).
medichain.anclaje.espera-reemplazo=PT3M
# Límite de gas: estimación + 30 % dentro de [gas-minimo; gas-maximo]; si no entra, el anclaje NO se envía
# (FALLIDO con el motivo, sin gastar; nunca se recorta el límite para enviar igual).
# Post-Glamsterdam (Sepolia, 06/10/2026): primer anclaje de un contrato ~353.000 de gas, los siguientes ~154.000.
medichain.anclaje.gas-minimo=100000
medichain.anclaje.gas-maximo=500000
# Freno por saldo: la tarea automática no ancla si el saldo no alcanza para estos anclajes (al costo estimado);
# el anclaje manual (POST /api/registros-blockchain/anclar) sí envía si alcanza para uno.
medichain.anclaje.saldo-minimo-anclajes=10
# Cada cuánto se ancla (si hubo eventos nuevos) y cada cuánto se siguen las confirmaciones.
medichain.anclaje.intervalo=PT5M
medichain.anclaje.demora-inicial=PT1M
medichain.anclaje.intervalo-seguimiento=PT15S
# web3j loguea URL y cuerpo de cada pedido en DEBUG, y la URL lleva la API key: nunca en DEBUG.
logging.level.org.web3j=INFO
logging.level.okhttp3=INFO
