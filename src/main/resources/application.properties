# Configuración de MediChain. Este archivo SE VERSIONA: no contiene secretos.
# Todo lo sensible llega por variables de entorno (ver .env.example, en la raíz):
#   secretos obligatorios: ${VARIABLE} sin default (DB_PASSWORD, JWT_SECRET);
#   secretos opcionales:   ${VARIABLE:} con default vacío, nunca con un valor
#   (ADMIN_PASSWORD, DEMO_PASSWORD, SEPOLIA_RPC_URL, WALLET_PRIVATE_KEY).
spring.application.name=trazabilidad-con-blockchain
server.port=8080

# PostgreSQL: sin credenciales acá. Definir DB_URL, DB_USER y DB_PASSWORD
# como variables de entorno (ver .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Esquema de la base: lo crean y lo cambian SOLO las migraciones de Flyway
# (src/main/resources/db/migration, V<n>__descripcion.sql). Hibernate solo lo valida al arrancar.
spring.flyway.locations=classpath:db/migration
# Una base con tablas pero sin historial de Flyway NO se adopta: la app no arranca (reset-demo.sh).
spring.flyway.baseline-on-migrate=false
# Una migración ya aplicada que cambió (checksum distinto) frena el arranque.
spring.flyway.validate-on-migrate=true
# Nunca borrar la base desde Flyway.
spring.flyway.clean-disabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson: hora local de Argentina en las respuestas JSON (las fechas se guardan en UTC).
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Paginación (Page<T> de Spring Data). Formato estable del JSON: {content, page{size, number, totalElements, totalPages}}.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# OpenAPI: contrato en /api-docs (ruta oficial; copia versionada en docs/openapi.json) y Swagger UI.
# Solo se publican con SWAGGER_HABILITADO=true (desarrollo y demo); sin la variable, responden 404.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_HABILITADO:false}
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:false}
# Claves ordenadas: el contrato generado es estable y se puede comparar con docs/openapi.json.
springdoc.writer-with-order-by-keys=true
# Las respuestas son JSON: el contrato lo dice (si no, springdoc publica */*).
springdoc.default-produces-media-type=application/json

# JWT: secreto HMAC de al menos 256 bits, solo por variable de entorno.
jwt.secret=${JWT_SECRET}
jwt.expiracion-horas=8

# Usuario inicial SEDE_CENTRAL (lo crea DatosIniciales si no existe ninguno).
medichain.admin.email=${ADMIN_EMAIL:}
medichain.admin.password=${ADMIN_PASSWORD:}

# Datos de demo: solo con SPRING_PROFILES_ACTIVE=demo (config/DatosDemo).
medichain.demo.password=${DEMO_PASSWORD:}

# Documentos de habilitación (PDF): carpeta FUERA del repo. Sin DOCUMENTOS_DIR la app no arranca.
medichain.documentos.dir=${DOCUMENTOS_DIR:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Inserción en tandas (lotes de hasta 10.000 cajas): los ids UUID los genera Hibernate, así que se pueden agrupar.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Anclaje en Ethereum Sepolia (paso 8, R15). APAGADO por defecto: la app y los tests no usan blockchain.
# Secretos SOLO por variables de entorno: SEPOLIA_RPC_URL (lleva la API key) y WALLET_PRIVATE_KEY.
# ANCHOR_CONTRACT_ADDRESS: el contrato MediChainAnchor (contracts/GUIA-DESPLIEGUE.md). Base nueva = contrato nuevo.
medichain.anclaje.habilitado=${ANCLAJE_HABILITADO:false}
medichain.anclaje.rpc-url=${SEPOLIA_RPC_URL:}
medichain.anclaje.clave-privada=${WALLET_PRIVATE_KEY:}
medichain.anclaje.contrato=${ANCHOR_CONTRACT_ADDRESS:}
medichain.anclaje.chain-id=11155111
medichain.anclaje.red=sepolia
medichain.anclaje.confirmaciones=3
medichain.anclaje.max-intentos=5
medichain.anclaje.tope-gwei=20
medichain.anclaje.espera-reemplazo=PT3M
# Límite de gas: estimación + 30 % dentro de [gas-minimo; gas-maximo]; si no entra, NO se envía (nunca se recorta).
# Post-Glamsterdam (Sepolia, 06/10/2026): primer anclaje de un contrato ~353.000 de gas, los siguientes ~154.000.
medichain.anclaje.gas-minimo=100000
medichain.anclaje.gas-maximo=500000
# La tarea automática no ancla si el saldo no alcanza para estos anclajes (el manual, con alcanzar para uno).
medichain.anclaje.saldo-minimo-anclajes=10
medichain.anclaje.intervalo=PT5M
medichain.anclaje.demora-inicial=PT1M
medichain.anclaje.intervalo-seguimiento=PT15S
# web3j loguea URL y cuerpo de cada pedido en DEBUG, y la URL lleva la API key: nunca en DEBUG.
logging.level.org.web3j=INFO
logging.level.okhttp3=INFO
