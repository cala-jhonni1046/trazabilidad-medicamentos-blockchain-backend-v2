# Perfil "test": lo activan los tests de integración (*IT, IntegracionBase).
# Se suma a src/main/resources/application.properties (la configuración real) y
# reemplaza SOLO lo que depende del entorno, con valores FIJOS y FALSOS a propósito:
# ./mvnw verify corre sin .env ni variables de entorno.
# La base de datos NO se configura acá: la provee el contenedor de Testcontainers
# (@ServiceConnection), que tiene prioridad sobre spring.datasource.*.

# JWT: secreto falso, solo para tests (los tokens no sirven fuera de esta suite).
jwt.secret=solo-para-tests-de-integracion-medichain-no-es-un-secreto-real
jwt.expiracion-horas=8

# Usuario inicial SEDE_CENTRAL que crea DatosIniciales (cada test lo recrea después de limpiar la base).
medichain.admin.email=sede@integracion.test
medichain.admin.password=clave-falsa-de-la-sede

# Sin datos de demo ni anclaje en blockchain en los tests.
medichain.demo.password=
medichain.anclaje.habilitado=false
medichain.anclaje.rpc-url=
medichain.anclaje.clave-privada=
medichain.anclaje.contrato=

# PDFs de habilitación: dentro de target/ (se borra con mvn clean y nunca va a Git).
medichain.documentos.dir=target/it-documentos
